name: nemesis

services:
  postgres:
    image: postgres:15-alpine
    container_name: nemesis_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env or .env.local}
      POSTGRES_DB: ${DB_NAME:-nemesis_game}
    # SECURITY: Port 5432 is NOT exposed to host - only accessible within Docker network
    # Bot container connects via internal network using hostname "postgres"
    # This prevents unauthorized external access to the database
    # ports:
    #   - "5432:5432"  # COMMENTED OUT FOR SECURITY
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nemesis_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nemesis_redis
    # SECURITY: Port 6379 is NOT exposed to host - only accessible within Docker network
    # Bot container connects via internal network using hostname "redis"
    # ports:
    #   - "6379:6379"  # COMMENTED OUT FOR SECURITY
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - nemesis_network
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nemesis_bot
    environment:
      # Bot configuration
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env.local}
      BOT_USERNAME: ${BOT_USERNAME}
      
      # Database configuration (both formats for compatibility)
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-nemesis_game}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.local}
      DB_NAME: ${DB_NAME:-nemesis_game}
      
      # Redis configuration
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # Game configuration
      COOLDOWN_MINUTES: ${COOLDOWN_MINUTES:-5}
      STARS_PRICE: ${STARS_PRICE:-1}
      
      # Server configuration
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nemesis_network

  miniapp:
    build:
      context: ./app/ebashnya
      dockerfile: Dockerfile.miniapp
    container_name: nemesis_miniapp
    environment:
      # Bot configuration (для Telegram authentication)
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env.local}
      
      # Mini app configuration
      WEBAPP_URL: ${WEBAPP_URL:-http://localhost:8080}
      APP_NAME: ${APP_NAME:-game}
      PORT: ${MINIAPP_PORT:-8080}
      
      # Channel и Support
      CHANNEL: ${CHANNEL:-}
      SUPPORT_URL: ${SUPPORT_URL:-}
      
      # Stars configuration
      STARS_TEST: ${STARS_TEST:-0}
      
      # PostgreSQL configuration (shared with main bot)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.local}
      DB_NAME: ${DB_NAME:-nemesis_game}
      
      # Admin IDs (comma-separated)
      ADMIN_IDS: ${ADMIN_IDS:-678418106,793216884}
      
      # Time zone и Anti-Cheat
      AC_TZ: ${AC_TZ:-3}
      AC_DIGEST_HOUR: ${AC_DIGEST_HOUR:-12}
      
      # Reminder settings
      REMIND_GAP_H: ${REMIND_GAP_H:-8}
      REMIND_AWAY_MIN: ${REMIND_AWAY_MIN:-30}
      
      # Disable bot polling in miniapp (TypeScript bot handles all commands)
      EMBER_NO_BOT: ${EMBER_NO_BOT:-1}
    ports:
      - "${MINIAPP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      bot:
        condition: service_started
    restart: unless-stopped
    networks:
      - nemesis_network

volumes:
  postgres_data:
    name: nemesis_postgres_data
  redis_data:
    name: nemesis_redis_data

networks:
  nemesis_network:
    driver: bridge
